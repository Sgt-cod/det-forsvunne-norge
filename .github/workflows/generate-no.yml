name: Gerar e Publicar Vídeo Longo (Det Forsvunne Forge - NO)

on:
  # schedule:
  #  - cron: '0 19 * * *'  # 16:00 BRT (UTC-3), segunda e quinta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    # Sem isso o padrão do GitHub Actions é 6h — tempo demais pra um travamento
    # silencioso (download travado, deadlock de ffmpeg etc.) ficar rodando sem
    # avisar ninguém. 4h dá folga generosa pro vídeo longo (múltiplos capítulos +
    # pausas de revisão manual no Telegram, até 30 min de espera por clipe).
    timeout-minutes: 240

    steps:
      - name: Checkout código
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg e ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Liberar política do ImageMagick (necessário para legendas)
        run: |
          # Procura TODA policy.xml do ImageMagick (6, 7, /usr/local...) em vez de assumir um caminho:
          # o passo antigo só conhecia /etc/ImageMagick-6 e não fazia nada quando a runner usava outro,
          # e então TODAS as legendas falhavam com "not allowed by the security policy @/tmp/...".
          for POLICY_FILE in $(find /etc /usr/local/etc /usr/share -name policy.xml -path '*ImageMagick*' 2>/dev/null); do
            echo "Liberando $POLICY_FILE"
            sudo sed -i 's/rights="none"/rights="read|write"/g' "$POLICY_FILE"
            sudo sed -i '/pattern="@\*"/d' "$POLICY_FILE"
          done
          echo "--- política efetiva do ImageMagick (regras de path) ---"
          (convert -list policy 2>/dev/null || magick -list policy 2>/dev/null) | grep -i -B1 -A2 "domain: Path" || echo "(sem regras de path restritivas)"

      - name: Instalar dependências Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar vídeo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CONFIG_FILE: config_no.json
          WHISPER_MODEL_SIZE: medium
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_NO }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_NO }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_NO }}
          FISHAUDIO_API_KEY: ${{ secrets.FISHAUDIO_API_KEY }}
          FISHAUDIO_VOICE_ID: ${{ secrets.FISHAUDIO_VOICE_ID }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USAR_CURACAO: "true"
          VIDEO_TYPE: long
          # ── Descomente pra testar sem publicar / mais rápido ──────────────
          # PULAR_UPLOAD: "true"
          # LIMITE_CLIPES_TESTE: "2"
          # ── Ajustes opcionais (já têm padrão sensato no código) ───────────
          # DURACAO_MAXIMA_CLIPE: "20"
          # ATIVAR_LEGENDA: "true"
        run: |
          # Tentativa anterior usava py-spy via sudo, mas o sudo não achava o
          # binário (PATH restrito) e, como os steps do Actions rodam com
          # `bash -e`, esse primeiro erro matava o monitor inteiro sem avisar —
          # só saiu 1 tentativa em quase 3h. Trocado por algo mais simples e
          # sem dependência nenhuma: manda SIGUSR1 pro processo periodicamente,
          # e o generate_video.py (via faulthandler, biblioteca padrão) escreve
          # sozinho a pilha de TODAS as threads no próprio gerar_video_stdout.log
          # no instante em que recebe o sinal — funciona mesmo travado dentro
          # de uma leitura bloqueante.
          set +e  # controlamos o código de saída manualmente no final; um erro
                  # isolado no monitor não pode derrubar o script inteiro de novo

          python -u generate_video.py > gerar_video_stdout.log 2>&1 &
          PID=$!
          echo "generate_video.py rodando com PID $PID"

          # O diagnóstico já cumpriu a função (identificou o gargalo em
          # skip_frames/target_resolution). Mantido em intervalo LARGO (5 min)
          # só como rede de segurança: dá pra ver o log de progresso normal sem
          # a enxurrada de stack traces, mas se algo travar de verdade ainda
          # sobra rastro. Pra investigar de novo, baixe pra sleep 15.
          (
            while kill -0 "$PID" 2>/dev/null; do
              sleep 300
              if kill -0 "$PID" 2>/dev/null; then
                echo "=== $(date -u '+%Y-%m-%d %H:%M:%S') UTC: SIGUSR1 enviado (stack trace vai aparecer no gerar_video_stdout.log logo em seguida) ===" >> diagnostico_stacks.log
                kill -USR1 "$PID"
              fi
            done
          ) &
          MONITOR_PID=$!

          tail -f gerar_video_stdout.log --pid="$PID" &
          TAIL_PID=$!

          wait "$PID"
          EXIT_CODE=$?
          kill "$MONITOR_PID" 2>/dev/null
          kill "$TAIL_PID" 2>/dev/null
          exit $EXIT_CODE

      - name: Commit logs atualizados
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch videos_gerados_no.json temas_usados_no.json
          git add -f videos_gerados_no.json temas_usados_no.json
          git diff --staged --quiet || git commit -m "🎬 Novo vídeo longo gerado - $(date +'%Y-%m-%d')"
          git fetch origin main
          git pull origin main --rebase
          git push origin main || git push --force-with-lease origin main

      - name: Upload vídeo como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-long-no-${{ github.run_number }}
          path: videos/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload logs de diagnóstico (mesmo se travar ou der timeout)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-no-${{ github.run_number }}
          path: |
            gerar_video_stdout.log
            diagnostico_stacks.log
            videos/*.log
          retention-days: 7
          if-no-files-found: ignore
